# ═══════════════════════════════════════════════════════════════════
# Nginx Configuration for Horizon HR ERP
# ملف إعداد Nginx لنظام ERP في بيئة الإنتاج
#
# الاستخدام:
#   1. انسخ هذا الملف إلى: /etc/nginx/sites-available/horizon-hr
#   2. أنشئ رابط: ln -s /etc/nginx/sites-available/horizon-hr /etc/nginx/sites-enabled/
#   3. احصل على شهادة SSL: certbot --nginx -d your-domain.com
#   4. أعد تشغيل Nginx: sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════

# إعادة توجيه HTTP → HTTPS (إلزامي)
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # إعادة توجيه كل شيء لـ HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# الخادم الرئيسي مع SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── شهادات SSL (يُعبئها certbot تلقائياً) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ── إعدادات SSL الآمنة ──────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Headers أمنية إضافية ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── تحديد حجم الطلبات ───────────────────────────────────────
    client_max_body_size 50M;

    # ── Gzip ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Proxy لتطبيق Horizon HR ─────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Uploads ─────────────────────────────────────────────────
    location /uploads/ {
        alias /var/www/horizon-hr/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API endpoint مع rate limiting إضافي ─────────────────────
    location /api/trpc/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # زيادة timeout للعمليات المعقدة
        proxy_read_timeout 120s;
    }

    # ── Logs ────────────────────────────────────────────────────
    access_log /var/log/nginx/horizon-hr.access.log;
    error_log  /var/log/nginx/horizon-hr.error.log warn;
}
